services:
  build:
    environment:
      # HOSTUID/HOSTGID are auto-detected from the workspace owner; export
      # them only to override (see README). Unset = auto-detect.
      HOSTUID: ${HOSTUID}
      HOSTGID: ${HOSTGID}
      VERSION: ${VERSION}
    image: ${REGISTRY_IMAGE}:${TAG}
    platform: ${PLATFORM}
    volumes:
      - $PWD:$WORKSPACE
    working_dir: $WORKSPACE
    command: $SCRIPT
